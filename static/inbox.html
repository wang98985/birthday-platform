<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>愿望信箱</title>
<style>
  :root { --paper:#f7f3ec; --ink:#2b2722; --muted:#8b8175; --line:#e4dbcd; --accent:#b88a5a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 28px 18px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .meta { font-size: 12px; color: var(--muted); }
  .toolbar { display: flex; gap: 8px; margin: 16px 0 20px; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--line); background: #fffdf8; color: var(--ink);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fffdf8; }
  .state { font-size: 13px; color: var(--muted); padding: 40px 0; text-align: center; line-height: 1.9; }
  .state b { color: var(--ink); }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    background: #fffdf8; border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  li .from { font-size: 12px; color: var(--accent); margin-bottom: 6px; font-weight: 600; }
  li .from .new {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
    background: var(--accent); color: #fffdf8; font-size: 10px; font-weight: 500;
  }
  li .text { font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  li .time { margin-top: 8px; font-size: 12px; color: var(--muted); }
  li .acts { margin-top: 8px; text-align: right; }
  li .del { border: none; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 4px; }
  li .del:hover { color: #b04a3a; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: rgba(43,39,34,.92); color: #fff; font-size: 13px;
    padding: 8px 16px; border-radius: 999px; opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 9;
  }
  .toast.show { opacity: 1; }
  .legend { display: none; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  .legend.show { display: flex; }
  .legend .chip {
    padding: 1px 7px; border-radius: 999px; background: var(--accent);
    color: #fffdf8; font-size: 10px;
  }
  .new-tip {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
    border: none; border-radius: 999px; padding: 9px 18px; font-size: 13px;
    background: var(--accent); color: #fffdf8; cursor: pointer; z-index: 10;
    box-shadow: 0 6px 18px rgba(0,0,0,.18); display: none;
  }
  .new-tip.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">愿望信箱</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="toolbar">
    <button class="btn" id="btn-refresh">刷新</button>
    <button class="btn" id="btn-read-all">一键已读</button>
    <button class="btn" id="btn-share">复制送 Ta 的链接</button>
    <button class="btn" id="btn-edit">编辑这张卡片</button>
    <button class="btn" id="btn-delete-inbox">删除信箱</button>
    <button class="btn" id="btn-home">返回首页</button>
  </div>
  <div class="legend" id="legend"><span class="chip">新</span>上次打开信箱之后收到的愿望</div>
  <div class="state" id="state">正在打开信箱…</div>
  <ul id="list"></ul>
</div>
<div class="toast" id="toast"></div>
<button class="new-tip" id="new-tip" type="button"></button>

<script>
(function () {
  var slug = (location.pathname.match(/\/inbox\/([A-Za-z0-9]+)/) || [])[1] || "";
  var key = "";
  var hash = location.hash.replace(/^#/, "");
  if (hash.indexOf("k=") === 0) key = decodeURIComponent(hash.slice(2));

  var stateEl = document.getElementById("state");
  var listEl = document.getElementById("list");
  var titleEl = document.getElementById("title");
  var metaEl = document.getElementById("meta");
  var toastEl = document.getElementById("toast");

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }
  function fmt(ts) {
    var d = new Date(ts * 1000);
    function p(n) { return n < 10 ? "0" + n : "" + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
      " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function setIdle(text) {
    stateEl.style.display = "";
    stateEl.innerHTML = text;
    listEl.innerHTML = "";
  }

  var lastCount = 0;
  var pollingStopped = false;
  var tipEl = document.getElementById("new-tip");

  function hideNewTip() { tipEl.classList.remove("show"); }

  // 轮询只看条数，不打断阅读；有新愿望时提示，点击才加载
  function pollNew() {
    if (pollingStopped || document.hidden || !slug || !key) return;
    fetch("/api/wishes?slug=" + encodeURIComponent(slug) +
          "&key=" + encodeURIComponent(key) + "&count=1")
      .then(function (r) {
        // 卡片已被删除：停掉轮询，避免后台一直 404
        if (r.status === 404) { pollingStopped = true; hideNewTip(); return null; }
        return r.ok ? r.json() : null;
      })
      .then(function (d) {
        if (!d) return;
        var diff = (d.count || 0) - lastCount;
        if (diff > 0) {
          tipEl.textContent = "收到 " + diff + " 条新愿望 · 点击查看";
          tipEl.classList.add("show");
        } else if (diff < 0) {
          lastCount = d.count || 0;
        }
      })
      .catch(function () {});
  }

  if (!slug || !key) {
    setIdle("这个信箱链接不完整。<br>请使用分享时给出的完整链接（结尾带 <b>#k=…</b> 凭证）。<br>凭证相当于钥匙，只保存在你自己的设备上。");
    return;
  }

  function load() {
    stateEl.style.display = "";
    stateEl.textContent = "正在打开信箱…";
    fetch("/api/wishes?slug=" + encodeURIComponent(slug) + "&key=" + encodeURIComponent(key))
      .then(function (res) {
        if (res.status === 403) throw new Error("forbidden");
        if (res.status === 404) throw new Error("notfound");
        if (!res.ok) throw new Error("bad");
        return res.json();
      })
      .then(function (data) {
        lastCount = data.count || 0;
        hideNewTip();
        var name = data.name || "Ta";
        titleEl.textContent = "";
        titleEl.appendChild(document.createTextNode("给 "));
        var nameSpan = document.createElement("span");
        nameSpan.textContent = name;
        titleEl.appendChild(nameSpan);
        titleEl.appendChild(document.createTextNode(" 的愿望信箱"));
        document.title = (data.unread ? "(" + data.unread + ") " : "") + name + " 的愿望信箱";
        metaEl.textContent = "共 " + data.count + " 条" +
          (data.unread ? " · " + data.unread + " 条是新的" : "");
        // 「新」徽标图例：只在本次确实有新愿望时说明
        document.getElementById("legend").classList.toggle("show", !!data.unread);
        if (!data.wishes.length) {
          setIdle("还没有收到愿望。<br>把下面的链接发给 Ta，等 Ta 许愿后这里就会出现。");
          return;
        }
        stateEl.style.display = "none";
        listEl.innerHTML = "";
        data.wishes.forEach(function (w) {
          var li = document.createElement("li");
          var from = document.createElement("div");
          from.className = "from";
          from.textContent = "来自 " + (w.sender || "匿名朋友");
          if (w.id > (data.lastReadId || 0)) {
            var badge = document.createElement("span");
            badge.className = "new";
            badge.textContent = "新";
            from.appendChild(badge);
          }
          var p = document.createElement("div");
          p.className = "text";
          p.textContent = w.content;
          var t = document.createElement("div");
          t.className = "time";
          t.textContent = fmt(w.createdAt);
          var acts = document.createElement("div");
          acts.className = "acts";
          var del = document.createElement("button");
          del.type = "button";
          del.className = "del";
          del.textContent = "删除";
          del.addEventListener("click", function () {
            if (!window.confirm("删除这条愿望？删除后无法恢复。")) return;
            fetch("/api/wishes/" + w.id + "?slug=" + encodeURIComponent(slug) +
                  "&key=" + encodeURIComponent(key), { method: "DELETE" })
              .then(function (r) {
                if (!r.ok && r.status !== 404) throw new Error("fail");
                toast("已删除");
                load();
              })
              .catch(function () { toast("删除失败，请刷新后重试"); });
          });
          acts.appendChild(del);
          li.appendChild(from);
          li.appendChild(p);
          li.appendChild(t);
          li.appendChild(acts);
          listEl.appendChild(li);
        });
      })
      .catch(function (err) {
        if (err.message === "forbidden") {
          pollingStopped = true;
          hideNewTip();
          setIdle("凭证无效，无法查看这个信箱。<br>请确认链接里的 <b>#k=…</b> 部分没有被改动。");
        } else if (err.message === "notfound") {
          pollingStopped = true;
          hideNewTip();
          setIdle("这份祝福不存在，可能已经被删除。");
        } else {
          setIdle("打开失败，请刷新重试。");
        }
      });
  }

  document.getElementById("btn-refresh").addEventListener("click", load);
  document.getElementById("btn-share").addEventListener("click", function () {
    var link = location.origin + "/c/" + slug;
    navigator.clipboard.writeText(link).then(function () { toast("已复制送 Ta 的链接"); },
      function () { toast(link); });
  });
  document.getElementById("btn-edit").addEventListener("click", function () {
    location.href = "/?edit=" + encodeURIComponent(slug) + "#k=" + encodeURIComponent(key);
  });
  document.getElementById("btn-read-all").addEventListener("click", function () {
    fetch("/api/wishes/read-all", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slug: slug, key: key })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      toast("已全部标为已读");
      load();
    }).catch(function () { toast("操作失败，请刷新重试"); });
  });
  document.getElementById("btn-delete-inbox").addEventListener("click", function () {
    if (!window.confirm("删除这个信箱？\n分享链接会失效，收到的愿望也会一并删除，且无法恢复。")) return;
    fetch("/api/cards/" + encodeURIComponent(slug) + "?key=" + encodeURIComponent(key),
      { method: "DELETE" }).then(function (r) {
      if (!r.ok && r.status !== 404) throw new Error("HTTP " + r.status);
      pollingStopped = true;
      hideNewTip();
      try {
        var saved = JSON.parse(localStorage.getItem("bday_inboxes") || "[]");
        if (Array.isArray(saved)) {
          localStorage.setItem("bday_inboxes", JSON.stringify(
            saved.filter(function (x) { return x.slug !== slug; })));
        }
        var s = JSON.parse(localStorage.getItem("bday_last_share") || "null");
        if (s && s.slug === slug) localStorage.removeItem("bday_last_share");
      } catch (e) {}
      ["btn-refresh", "btn-read-all", "btn-share", "btn-edit", "btn-delete-inbox"].forEach(function (id) {
        var b = document.getElementById(id);
        if (b) b.style.display = "none";
      });
      document.getElementById("list").innerHTML = "";
      document.getElementById("legend").style.display = "none";
      setIdle("信箱已删除。<br>分享链接已失效，收到的愿望已一并清除。");
      document.getElementById("title").textContent = "信箱已删除";
      document.getElementById("meta").textContent = "";
    }).catch(function () { toast("删除失败，请稍后重试"); });
  });
  document.getElementById("btn-home").addEventListener("click", function () { location.href = "/"; });
  tipEl.addEventListener("click", function () { hideNewTip(); load(); });
  setInterval(pollNew, 30000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) pollNew();
  });

  load();
})();
</script>
</body>
</html>
